openapi: 3.0.3
info:
  title: MoFA Engine Unified API
  version: 3.3.0
  description: |
    Multimodal AI Inference Orchestration Gateway REST & Streaming API Specification.
    Directly verified against Aayan's core engine implementation (`origin/engine`).
    Defines unary invocations, real-time SSE token streaming (`/v1/invoke/stream`),
    manual model lifecycle (`/v1/models/load`, `/v1/models/unload`),
    preflight subscriptions (`/v1/subscriptions`), dual-track financial & token usage metrics,
    and Prometheus text exposition.
servers:
  - url: http://127.0.0.1:8420
    description: Local MoFA Engine Gateway Daemon (Default Port 8420 per PRD §6.5)

paths:
  /health:
    get:
      summary: Health check endpoint
      description: Returns engine health status, version, and uptime.
      operationId: getHealth
      responses:
        '200':
          description: Engine is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, version, uptime_secs]
                properties:
                  status: { type: string, example: "ok" }
                  version: { type: string, example: "0.1.0" }
                  uptime_secs: { type: integer, example: 42 }

  /v1/capabilities:
    get:
      summary: List registered model cards and capabilities
      description: Returns all discovered and configured model cards across local and cloud providers.
      operationId: getCapabilities
      responses:
        '200':
          description: List of Model Cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelCard'

  /v1/status:
    get:
      summary: Get overall engine status snapshot
      description: Returns memory footprint, loaded models count, provider health map, and backend statuses.
      operationId: getStatus
      responses:
        '200':
          description: Engine Status Snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineStatus'

  /v1/invoke:
    post:
      summary: Execute capability inference request (Unary)
      description: Primary capability invocation route supporting text, audio, vision, image generation, and routing preferences.
      operationId: invokeCapability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InferenceRequest'
      responses:
        '200':
          description: Successful capability invocation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceResponse'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
        '404':
          description: No capable provider or model available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'

  /v1/invoke/stream:
    post:
      summary: Real-time Server-Sent Events (SSE) token stream invocation
      description: Streams real-time token chunks and completion metadata over SSE.
      operationId: invokeStream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InferenceRequest'
      responses:
        '200':
          description: Server-Sent Events token stream (StreamChunk variant payloads)
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/StreamChunk'

  /v1/models/load:
    post:
      summary: Manually load (warm) a model into memory
      operationId: loadModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelActionRequest'
      responses:
        '200':
          description: Model loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelActionResponse'

  /v1/models/unload:
    post:
      summary: Manually unload a model from memory
      operationId: unloadModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelActionRequest'
      responses:
        '200':
          description: Model unloaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelActionResponse'

  /v1/subscriptions:
    post:
      summary: Preflight model subscription warmup endpoint
      description: Registers capability subscriptions with optional TTL to prevent cold-start latency.
      operationId: subscribeWarmup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscribeRequest'
      responses:
        '200':
          description: Subscription registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionInfo'

  /v1/events:
    get:
      summary: Real-time system SSE telemetry event stream
      description: Pushes system-wide events (ModelStatusChanged, RequestCompleted, MemoryChanged, ModelEvicted, etc.).
      operationId: subscribeSystemEvents
      responses:
        '200':
          description: Server-Sent Events system stream
          content:
            text/event-stream:
              schema:
                type: string

  /metrics:
    get:
      summary: Prometheus text exposition endpoint
      description: Exposes Prometheus metrics tagged with mandatory provider and locality labels.
      operationId: getPrometheusMetrics
      responses:
        '200':
          description: Prometheus text exposition format
          content:
            text/plain:
              schema:
                type: string

components:
  schemas:
    InferenceRequest:
      type: object
      required: [messages]
      properties:
        capability:
          type: string
          enum: [chat, tts, asr, image_gen, video_gen, vlm, embedding]
        model:
          type: string
          description: Canonical `provider/model` ID or unique short model name.
        app_id:
          type: string
        session_id:
          type: string
        fallback_policy:
          type: string
          enum: [capability_only, disabled, allow_named]
          default: capability_only
        locality:
          type: string
          enum: [auto, prefer_local, local_only]
          default: auto
          description: Routing locality guardrail. `local_only` restricts to local backends; `prefer_local` ranks local ahead of cloud.
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        input_file:
          type: string
          description: Path on the engine host.
        params:
          type: object
        hint_next:
          type: string
        request_id:
          type: string

    Message:
      type: object
      required: [role, content]
      properties:
        role: { type: string }
        content: { type: string }

    InferenceResponse:
      type: object
      required: [request_id, provider, model_used, duration_ms]
      properties:
        text: { type: string }
        file: { type: string }
        model_used: { type: string }
        provider: { type: string }
        duration_ms: { type: integer }
        request_id: { type: string }
        tokens_used: { type: integer }
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        cost_usd: { type: number, format: float }
        fallback_used: { type: boolean }
        routing_reason: { type: string }

    StreamChunk:
      description: Discrimination by `type` for real-time SSE stream events.
      oneOf:
        - type: object
          required: [type, request_id, model_used, provider]
          properties:
            type: { const: started }
            request_id: { type: string }
            model_used: { type: string }
            provider: { type: string }
        - type: object
          required: [type, delta]
          properties:
            type: { const: text }
            delta: { type: string }
        - type: object
          required: [type, duration_ms, fallback_used]
          properties:
            type: { const: completed }
            duration_ms: { type: integer }
            tokens_used: { type: integer }
            prompt_tokens: { type: integer }
            completion_tokens: { type: integer }
            cost_usd: { type: number }
            file: { type: string }
            fallback_used: { type: boolean }
            routing_reason: { type: string }
        - type: object
          required: [type, code, message, retryable]
          properties:
            type: { const: error }
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean }
            source: { type: string }

    SubscribeRequest:
      type: object
      required: [capabilities]
      properties:
        app_id: { type: string }
        session_id: { type: string }
        capabilities:
          type: array
          items:
            type: string
            enum: [chat, tts, asr, image_gen, video_gen, vlm, embedding]
        ttl_secs:
          type: integer

    SubscriptionInfo:
      type: object
      properties:
        id: { type: integer }
        app_id: { type: string }
        session_id: { type: string }
        capabilities:
          type: array
          items: { type: string }
        expires_in_secs: { type: integer }

    ModelActionRequest:
      type: object
      required: [model_id]
      properties:
        model_id: { type: string }

    ModelActionResponse:
      type: object
      required: [model_id, changed]
      properties:
        model_id: { type: string }
        changed: { type: boolean }

    ModelCard:
      type: object
      required: [id, name, provider, capability, status, cost_tier]
      properties:
        id: { type: string }
        name: { type: string }
        provider: { type: string }
        capability: { type: string }
        status: { type: string }
        cost_tier: { type: string }
        context_window: { type: integer }
        memory_estimate_bytes: { type: integer }

    EngineStatus:
      type: object
      required: [total_models, loaded_models, providers, memory_used_bytes, memory_budget_bytes, uptime_secs]
      properties:
        total_models: { type: integer }
        loaded_models: { type: integer }
        providers: { type: integer }
        memory_used_bytes: { type: integer }
        memory_budget_bytes: { type: integer }
        uptime_secs: { type: integer }

    ErrorInfo:
      type: object
      required: [code, message, retryable]
      properties:
        code: { type: string }
        message: { type: string }
        retryable: { type: boolean }
        source: { type: string }
