openapi: 3.1.0
info:
  title: MoFA Engine API
  version: 0.1.0
  description: >-
    MoFA Engine HTTP API: deterministic capability routing with failover,
    reservation-based memory and lifecycle management, Preflight
    (hint/subscription/history) warming, dual-track (local/cloud) observability,
    real token streaming, and the stateful Responses API.


    ## Versioning

    Business endpoints are served under the `/v1` prefix, which is the stability
    contract for this API. Operational endpoints (`/`, `/health`, `/metrics`) are
    intentionally unversioned, since they are process/infrastructure contracts
    rather than part of the evolving API surface.


    ## Authentication

    When the daemon is started with the `MOFA_API_TOKEN` environment variable,
    every `/v1` route requires an `Authorization: Bearer <token>` header and a
    request without a valid token receives `401`. When `MOFA_API_TOKEN` is unset
    (appropriate only for a trusted local machine) the `/v1` API is open. The
    public operational routes (`/`, `/health`, `/metrics`) are never gated.


    Every response carries an `x-request-id` header for log correlation; a
    client-supplied `x-request-id` (up to 128 chars) is echoed back, otherwise the
    engine generates one.
# Bearer auth applies to every operation by default; the public operational
# routes below opt out with an empty `security: []`.
security:
  - bearerAuth: []
paths:
  /:
    get:
      summary: Embedded dashboard (HTML)
      security: []
      responses:
        "200":
          description: The dashboard single-page app.
          content:
            text/html:
              schema:
                type: string
  /health:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: Engine process health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /metrics:
    get:
      summary: Prometheus text-exposition metrics
      description: >
        Bounded-cardinality engine metrics (requests, failures, fallback,
        load/unload/eviction counters, a request-latency histogram, per-provider
        token/cost totals tagged by locality, and memory / model / provider
        gauges). Public — not behind the `/v1` auth gate, so scrapers can reach it.
      security: []
      responses:
        "200":
          description: Prometheus exposition text.
          content:
            text/plain:
              schema:
                type: string
  /v1/capabilities:
    get:
      summary: List registered model capabilities
      responses:
        "200":
          description: Registered model cards.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModelCard"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/status:
    get:
      summary: Get engine status
      responses:
        "200":
          description: Engine, backend, and memory status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/events:
    get:
      summary: Subscribe to server-sent engine events
      responses:
        "200":
          description: SSE event stream.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/discovery/refresh:
    post:
      summary: Refresh backend health and model discovery
      responses:
        "200":
          description: Updated engine status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/invoke:
    post:
      summary: Invoke a model by capability or name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InferenceRequest"
      responses:
        "200":
          description: Inference result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InferenceResponse"
        "400":
          description: Invalid request or unsupported operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No model satisfies the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInfo"
        "500":
          description: >
            Internal error (provider error, memory pressure, or misconfiguration).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInfo"
        "503":
          description: >
            Provider circuit is open, or every failover candidate was exhausted
            (the error's `failed_chain` lists each attempt).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInfo"
        "504":
          description: Request timed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInfo"
  /v1/invoke/stream:
    post:
      summary: Invoke a model and stream typed output as Server-Sent Events
      description: >
        Streams the response as SSE. Each `data:` line is a JSON StreamChunk: a
        `started` event, then zero or more `text` (and, for reasoning-capable
        models, `reasoning`) deltas, then a terminal `completed` or `error`.
        Errors after the stream opens are delivered in-band as an `error` chunk
        (HTTP status is 200 once streaming begins), so clients handle success and
        failure through one channel. The interface is versioned and supports a
        non-streaming compatibility mode, in which a backend emits `started`, a
        single full-text `text` chunk, then `completed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InferenceRequest"
      responses:
        "200":
          description: A Server-Sent Events stream of StreamChunk objects.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/StreamChunk"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/responses:
    post:
      summary: One turn of the stateful Responses API (multi-turn deep reasoning)
      description: >
        Runs one conversation turn. The engine stores the running message history
        keyed by the returned `id`; continue the conversation by sending that id
        as `previous_response_id` on the next turn instead of resending history.
        The body is a superset of InferenceRequest (all routing knobs apply) plus
        `previous_response_id`, `instructions` (system prompt for a new
        conversation), and `input` (a single-user-message shorthand).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResponsesRequest"
      responses:
        "200":
          description: The reply plus the conversation id to continue from.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsesResponse"
        "400":
          description: No input, or an unknown/expired previous_response_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No model satisfies the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInfo"
        "500":
          description: Internal error while serving the turn.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInfo"
        "503":
          description: Provider circuit open, or every failover candidate exhausted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInfo"
        "504":
          description: Request timed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInfo"
  /v1/responses/{id}:
    get:
      summary: Stored message history for a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The stored messages, in order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown conversation id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInfo"
    delete:
      summary: Forget a stored conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The conversation was removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemovedResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown conversation id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemovedResponse"
  /v1/memory:
    get:
      summary: Current memory accounting (budget, reservations, leases)
      responses:
        "200":
          description: Memory report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/lifecycle:
    get:
      summary: Rolling model lifecycle history (load/unload/evict)
      responses:
        "200":
          description: Lifecycle records, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LifecycleRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/preflight:
    get:
      summary: Preflight effectiveness counters
      responses:
        "200":
          description: Preflight statistics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreflightStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/subscriptions:
    get:
      summary: List active capability subscriptions
      responses:
        "200":
          description: Active subscriptions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubscriptionInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Create a capability subscription (kept warm + eviction-protected)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscribeRequest"
      responses:
        "200":
          description: Subscription created.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: integer
        "400":
          description: Empty or invalid capability list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/subscriptions/{id}:
    delete:
      summary: Remove a capability subscription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Subscription removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemovedResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemovedResponse"
  /v1/models/load:
    post:
      summary: Manually load (warm) a model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelActionRequest"
      responses:
        "200":
          description: Model loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelActionResponse"
        "400":
          description: Unknown model.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Load failed (provider error, memory pressure, or timeout).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInfo"
  /v1/models/unload:
    post:
      summary: Manually unload a model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelActionRequest"
      responses:
        "200":
          description: >
            Model unloaded; `changed` is false when the model was not known.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelActionResponse"
        "400":
          description: Model is busy and cannot be unloaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Required on `/v1` routes when the daemon is started with `MOFA_API_TOKEN`.
  responses:
    Unauthorized:
      description: >
        Missing or invalid bearer token (only when the daemon is started with
        `MOFA_API_TOKEN`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorInfo"
  schemas:
    HealthResponse:
      type: object
      required: [status, version, uptime_secs]
      properties:
        status:
          type: string
        version:
          type: string
        uptime_secs:
          type: integer
    InferenceRequest:
      type: object
      properties:
        capability:
          type: string
          enum: [chat, tts, asr, image_gen, video_gen, vlm, embedding]
        model:
          type: string
          description: Canonical `provider/model` ID or unique short model name.
        app_id:
          type: string
        session_id:
          type: string
        fallback_policy:
          type: string
          enum: [capability_only, disabled, allow_named]
          default: capability_only
        prefer:
          type: string
          enum: [auto, local, cloud]
          default: auto
          description: >
            Backend-locality preference / privacy guardrail. `local` is a hard
            constraint restricting the request to local backends (confidential data
            never leaves the device; fails rather than falling back to cloud);
            `cloud` restricts to cloud backends; `auto` (default) ranks local ahead
            of cloud while keeping cloud as a fallback. Accepts the legacy field
            name `locality` and value `local_only` as aliases.
        data_class:
          type: string
          enum: [public, internal, confidential]
          default: public
          description: >
            Data-sensitivity class. `confidential` is a hard data-residency
            constraint — the request is pinned to local backends regardless of
            `prefer` (and overrides a conflicting `prefer=cloud`), failing rather
            than sending sensitive data to the cloud. Every request's effective
            locality is written to the `mofa::audit` log for traceability.
        reasoning:
          type: object
          description: >
            Deep-thinking controls for reasoning-capable models. Omit for standard
            behavior. `effort` also drives inference-tier routing; when `include`
            is true the thought chain is streamed as `reasoning` chunks (distinct
            from answer `text`) rather than stripped.
          properties:
            effort:
              type: string
              enum: [low, medium, high]
              default: medium
            include:
              type: boolean
              default: false
        max_cost_usd:
          type: number
          format: double
          description: >
            Per-request spend ceiling in USD. A candidate whose estimated cost
            exceeds this is skipped during routing (and listed in the error's
            `failed_chain`), so spend stays bounded and cheaper/local models win.
            Free and local models estimate to $0 and are always affordable, so
            `0.0` means "free/local only". Omit for no ceiling. The estimate is a
            pre-flight approximation (token counts from input size); the
            authoritative cost is reported per response as `cost_usd`.
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        input_file:
          type: string
          description: Path on the engine host.
        params:
          type: object
          description: >
            Capability-specific passthrough options. Recognized keys include
            `input` (TTS/embedding text; string or array for embedding),
            `voice` (TTS), `language` and `diarize` (ASR speaker separation, S1),
            `detail` (VLM billing tier), `prompt` / `negative_prompt` / `size`
            (`WxH`) / `width` / `height` (ImageGen and VideoGen), `seconds` and
            `fps` (VideoGen), and `max_tokens` (also used for the `max_cost_usd`
            estimate).
        hint_next:
          type: string
        request_id:
          type: string
    Message:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
        content:
          type: string
        images:
          type: array
          description: >
            Image references for multimodal (VLM) requests — HTTP(S) URLs, `data:`
            URLs, or local file paths. Omitted for text-only messages.
          items:
            type: string
    ResponsesRequest:
      type: object
      description: >
        A superset of InferenceRequest for the stateful Responses API. All
        InferenceRequest fields apply (flattened at the top level); the fields
        below are additional.
      allOf:
        - $ref: "#/components/schemas/InferenceRequest"
        - type: object
          properties:
            previous_response_id:
              type: string
              nullable: true
              description: >
                Continue the conversation stored under this prior response id.
                Omit to start a new conversation; an unknown id is a 400.
            instructions:
              type: string
              nullable: true
              description: System prompt, applied only when starting a new conversation.
            input:
              type: string
              nullable: true
              description: Shorthand for a single new user message this turn.
    ResponsesResponse:
      type: object
      description: >
        A superset of InferenceResponse: the same fields plus the conversation
        `id` and `message_count`.
      allOf:
        - $ref: "#/components/schemas/InferenceResponse"
        - type: object
          required: [id, message_count]
          properties:
            id:
              type: string
              description: Id of this response; pass as previous_response_id to continue.
            message_count:
              type: integer
              description: Total messages now stored in the conversation.
    InferenceResponse:
      type: object
      properties:
        text:
          type: [string, "null"]
        file:
          type: [string, "null"]
          description: Output file path (TTS, image gen, video gen).
        embedding:
          type: [array, "null"]
          description: >
            Embedding vectors for the `embedding` capability — one row per input,
            in input order. Omitted for non-embedding responses.
          items:
            type: array
            items:
              type: number
        model_used:
          type: string
        provider:
          type: string
        duration_ms:
          type: integer
        request_id:
          type: string
        tokens_used:
          type: [integer, "null"]
        prompt_tokens:
          type: [integer, "null"]
        completion_tokens:
          type: [integer, "null"]
        cost_usd:
          type: [number, "null"]
          description: Estimated USD cost, if a price is configured for the provider.
        fallback_used:
          type: boolean
        routing_reason:
          type: [string, "null"]
    StreamChunk:
      description: >
        One event in a streaming response, discriminated by `type`. Serialized
        as internally-tagged JSON.
      oneOf:
        - type: object
          required: [type, request_id, model_used, provider]
          properties:
            type: { const: started }
            request_id: { type: string }
            model_used: { type: string }
            provider: { type: string }
        - type: object
          required: [type, delta]
          properties:
            type: { const: text }
            delta: { type: string }
        - type: object
          description: >
            A piece of the model's thought chain (reasoning-capable models),
            emitted distinctly from answer `text` so callers can display or audit
            it separately. Only produced when the request sets `reasoning.include`.
          required: [type, delta]
          properties:
            type: { const: reasoning }
            delta: { type: string }
        - type: object
          required: [type, duration_ms, fallback_used]
          properties:
            type: { const: completed }
            duration_ms: { type: integer }
            tokens_used: { type: [integer, "null"] }
            prompt_tokens: { type: [integer, "null"] }
            completion_tokens: { type: [integer, "null"] }
            cost_usd: { type: [number, "null"] }
            file: { type: [string, "null"] }
            fallback_used: { type: boolean }
            routing_reason: { type: [string, "null"] }
        - type: object
          description: >
            Terminal error event, carrying an ErrorInfo body flattened alongside
            the `type` tag.
          required: [type, code, message, retryable]
          properties:
            type: { const: error }
            code:
              type: string
              enum:
                [
                  no_capable_model,
                  provider_error,
                  circuit_open,
                  memory_pressure,
                  invalid_request,
                  timeout,
                  unsupported_operation,
                  config,
                  internal,
                ]
            message: { type: string }
            retryable: { type: boolean }
            source: { type: [string, "null"] }
            failed_chain:
              type: array
              items:
                $ref: "#/components/schemas/FailedAttempt"
            routing_reason: { type: [string, "null"] }
    ModelActionRequest:
      type: object
      required: [model_id]
      properties:
        model_id:
          type: string
          description: Canonical model id (`provider/model`).
    ModelActionResponse:
      type: object
      required: [model_id, changed]
      properties:
        model_id:
          type: string
        changed:
          type: boolean
    RemovedResponse:
      type: object
      required: [removed]
      properties:
        removed:
          type: boolean
    FailedAttempt:
      type: object
      required: [provider, model, reason]
      properties:
        provider: { type: string }
        model: { type: string }
        reason: { type: string }
    ErrorInfo:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          type: string
          enum:
            [
              no_capable_model,
              provider_error,
              circuit_open,
              memory_pressure,
              invalid_request,
              timeout,
              unsupported_operation,
              config,
              internal,
            ]
        message:
          type: string
        retryable:
          type: boolean
        source:
          type: string
        failed_chain:
          type: array
          description: >
            Complete per-candidate failure chain (present when failover was
            attempted and every candidate failed). Lets an Agent decide whether to
            retry or switch tiers rather than seeing only the last error.
          items:
            $ref: "#/components/schemas/FailedAttempt"
        routing_reason:
          type: string
          description: Machine-readable routing reason for the primary candidate.
    ExecutionState:
      type: object
      required: [active_requests, max_concurrency]
      properties:
        active_requests:
          type: integer
        max_concurrency:
          type: integer
    ModelCard:
      type: object
      properties:
        id:
          type: string
          description: Canonical `provider/model` identifier.
        name:
          type: string
        provider:
          type: string
        capability:
          type: string
          enum: [chat, tts, asr, image_gen, video_gen, vlm, embedding]
        capabilities:
          type: array
          items:
            type: string
            enum: [chat, tts, asr, image_gen, video_gen, vlm, embedding]
        status:
          type: string
          enum: [cold, warming, hot, busy, failed]
        availability:
          type: string
          enum: [discovered, configured, unavailable]
        residency:
          type: string
          enum: [unknown, unloaded, loading, loaded, unloading, remote]
        execution:
          $ref: "#/components/schemas/ExecutionState"
        cost_tier:
          type: string
          enum: [free, low, medium, high]
        context_window:
          type: integer
        memory_estimate_bytes:
          type: integer
        reasoning_tier:
          type: [string, "null"]
          enum: [low, medium, high, null]
          description: >
            Reasoning tier this model serves, for `reasoning.effort` tier routing.
            Null for non-tiered models.
    ProviderHealth:
      type: object
      required: [name, healthy, circuit_state]
      properties:
        name:
          type: string
        healthy:
          type: boolean
        circuit_state:
          type: string
    BackendStatus:
      type: object
      required: [name, kind, health, circuit_state, features]
      properties:
        name:
          type: string
        kind:
          type: string
          enum:
            [
              ollama,
              openai_compatible,
              local_tts,
              local_asr,
              local_image_gen,
              local_video_gen,
              liter_llm,
            ]
        health:
          type: string
          enum: [unknown, healthy, degraded, unavailable]
        circuit_state:
          type: string
          description: closed, open, or half_open.
        features:
          type: array
          items:
            type: string
            enum:
              [
                discovery,
                load,
                unload,
                residency_inspection,
                streaming,
                memory_reporting,
              ]
    EngineStatus:
      type: object
      properties:
        total_models:
          type: integer
        loaded_models:
          type: integer
        providers:
          type: integer
        memory_used_bytes:
          type: integer
        memory_budget_bytes:
          type: integer
        uptime_secs:
          type: integer
        provider_health:
          type: array
          items:
            $ref: "#/components/schemas/ProviderHealth"
        backends:
          type: array
          items:
            $ref: "#/components/schemas/BackendStatus"
    AllocationSnapshot:
      type: object
      properties:
        model_id:
          type: string
        reserved_bytes:
          type: integer
        observed_bytes:
          type: [integer, "null"]
        leases:
          type: integer
    MemoryReport:
      type: object
      properties:
        used_bytes:
          type: integer
        budget_bytes:
          type: integer
        available_bytes:
          type: integer
        allocations:
          type: array
          items:
            $ref: "#/components/schemas/AllocationSnapshot"
    LifecycleRecord:
      type: object
      properties:
        seq:
          type: integer
        at_ms:
          type: integer
          description: Milliseconds since engine start (monotonic).
        model_id:
          type: string
        event:
          type: string
          description: load, unload, evict, idle_unload, load_failed, etc.
        detail:
          type: [string, "null"]
    PreflightStats:
      type: object
      properties:
        warms_started:
          type: integer
        warms_completed:
          type: integer
        warms_failed:
          type: integer
        warms_skipped:
          type: integer
        predictions:
          type: integer
        hits:
          type: integer
        misses:
          type: integer
    SubscriptionInfo:
      type: object
      properties:
        id:
          type: integer
        app_id:
          type: [string, "null"]
        session_id:
          type: [string, "null"]
        capabilities:
          type: array
          items:
            type: string
            enum: [chat, tts, asr, image_gen, video_gen, vlm, embedding]
        expires_in_secs:
          type: [integer, "null"]
    SubscribeRequest:
      type: object
      required: [capabilities]
      properties:
        app_id:
          type: string
        session_id:
          type: string
        capabilities:
          type: array
          items:
            type: string
            enum: [chat, tts, asr, image_gen, video_gen, vlm, embedding]
        ttl_secs:
          type: integer
          description: Optional lifetime in seconds; omitted means until removed.
